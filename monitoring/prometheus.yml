global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Scrape the FastAPI MLOps API. Use host gateway so it works when:
  # - API runs on the Windows host (python mlops_api.py) while Prometheus is in Docker
  # - OR API is published on host port 8005 via docker compose port mapping
  - job_name: "scouts-mlops-api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:8005"]
        labels:
          env: "production"
          app: "scouts-mlops"
